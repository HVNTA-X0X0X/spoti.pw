name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Runs the file-system engine tests on Windows, including the Win32 directory lister and drive list.
      - name: Test
        run: cargo test --workspace
      - name: Build release
        run: cargo build --release -p filesrs
      - uses: actions/upload-artifact@v4
        with:
          name: filesrs-windows-x64
          path: target/release/filesrs.exe
